---
- name: Add user vector
  user:
    name: vector

- name: Create Directories
  file:
    path: "{{ item }}"
    state: directory
    owner: vector
    group: vector
    mode: 0755
  loop:
    - '/vector/'
    - '/var/lib/vector'
    - {{ vector_config_dir }}

- name: Download Vector .deb package
  get_url:
    url: "{{ vector_download_url }}"
    dest: "/tmp/vector.deb"

- name: Install Vector
  apt:
    deb: "/tmp/vector.deb"
    state: present

- name: Deploy vector config from template
  template:
    src: vector.toml.j2
    dest: "{{ vector_config_file }}"
    mode: '0644'

- name: Deploy vector config from template
  template:
    src: vector.yaml.j2
    dest: "{{ vector_config_file }}"
    mode: '0644'

- name: "Notify Handlers Now"
  meta: flush_handlers
